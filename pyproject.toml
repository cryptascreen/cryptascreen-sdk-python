[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptascreen"
version = "0.2.1"
description = "Official Python SDK for the CryptaScreen API — address and name screening, sanctions, exposure, investigations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CryptaCount, Inc.", email = "support@cryptacount.com" }]
maintainers = [{ name = "CryptaCount, Inc.", email = "support@cryptacount.com" }]
keywords = ["cryptascreen", "compliance", "screening", "sanctions", "crypto", "aml", "kyc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = ["httpx[http2]"]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff", "respx"]

[project.urls]
Documentation = "https://github.com/cryptascreen/cryptascreen-sdk-python#readme"
Repository = "https://github.com/cryptascreen/cryptascreen-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptascreen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["contract: runs against a LOCAL CryptaScreen stack (set CRYPTASCREEN_CONTRACT_URLS); skipped otherwise"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.ruff]
target-version = "py310"
line-length = 100
